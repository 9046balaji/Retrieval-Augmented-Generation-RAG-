<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748b; }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-style: italic; font-size: 11.5px; fill: #475569; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
      .white-text { fill: #ffffff; }
      .blue-text { fill: #0284c7; }
    </style>
    
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-8%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="580" fill="#ffffff" rx="16"/>

  <!-- Title Header -->
  <text x="500" y="42" text-anchor="middle" class="title">RAG Architecture</text>
  <line x1="465" y1="54" x2="535" y2="54" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= TOP: INDEXING PIPELINE ================= -->
  <rect x="25" y="75" width="950" height="135" rx="10" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5" />
  <text x="45" y="98" class="section-label">Indexing</text>

  <!-- Node: Documents -->
  <g transform="translate(55, 110)">
    <rect width="68" height="68" rx="10" fill="#f1f5f9" filter="url(#card-shadow)" />
    <!-- Document Icon -->
    <path d="M 24 16 L 40 16 L 48 24 L 48 50 C 48 51.5 46.5 52 45 52 L 24 52 C 22.5 52 21 51.5 21 50 L 21 18 C 21 16.5 22.5 16 24 16 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 40 16 L 40 24 L 48 24" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="27" y1="30" x2="42" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="27" y1="36" x2="42" y2="36" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="27" y1="42" x2="36" y2="42" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="34" y="85" text-anchor="middle" class="node-title">Documents</text>
    <text x="34" y="97" text-anchor="middle" class="node-desc">5,183 SciFact</text>
  </g>

  <!-- Arrow: Documents -> Chunks -->
  <path d="M 135 144 L 205 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="170" y="136" text-anchor="middle" class="arrow-label">Chunking</text>

  <!-- Node: Chunks -->
  <g transform="translate(215, 110)">
    <rect width="68" height="68" rx="10" fill="#f1f5f9" filter="url(#card-shadow)" />
    <!-- Chunks Icon -->
    <rect x="22" y="20" width="24" height="6" rx="2" fill="#94a3b8" />
    <rect x="22" y="30" width="24" height="6" rx="2" fill="#94a3b8" />
    <rect x="22" y="40" width="24" height="6" rx="2" fill="#94a3b8" />
    <text x="34" y="85" text-anchor="middle" class="node-title">Chunks</text>
    <text x="34" y="97" text-anchor="middle" class="node-desc">Passages</text>
  </g>

  <!-- Arrow: Chunks -> Embedding Model -->
  <path d="M 295 144 L 360 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Node: Embedding Model (Top) -->
  <g transform="translate(370, 105)">
    <!-- Neural Net Icon -->
    <circle cx="20" cy="30" r="4.5" fill="#3b82f6" />
    <circle cx="45" cy="18" r="4.5" fill="#3b82f6" />
    <circle cx="45" cy="42" r="4.5" fill="#3b82f6" />
    <circle cx="70" cy="30" r="4.5" fill="#3b82f6" />
    <line x1="20" y1="30" x2="45" y2="18" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="20" y1="30" x2="45" y2="42" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="45" y1="18" x2="70" y2="30" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="45" y1="42" x2="70" y2="30" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="45" y="65" text-anchor="middle" class="node-title">Embedding model</text>
    <text x="45" y="78" text-anchor="middle" class="node-desc">bge-base-en-v1.5</text>
  </g>

  <!-- Arrow: Embedding -> Vector -->
  <path d="M 470 144 L 525 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="497" y="136" text-anchor="middle" class="arrow-label">Vectorize</text>

  <!-- Node: Vector {...} -->
  <g transform="translate(535, 110)">
    <rect width="68" height="68" rx="10" fill="#f1f5f9" filter="url(#card-shadow)" />
    <text x="34" y="44" text-anchor="middle" class="code-font" fill="#475569">{...}</text>
    <text x="34" y="85" text-anchor="middle" class="node-title">Vectors</text>
    <text x="34" y="97" text-anchor="middle" class="node-desc">768-dim Embed</text>
  </g>

  <!-- Arrow: Vector -> Vector DB -->
  <path d="M 615 144 L 685 144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="650" y="136" text-anchor="middle" class="arrow-label">Indexing</text>

  <!-- Node: Vector Database -->
  <g transform="translate(695, 95)">
    <rect width="240" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="120" y="24" text-anchor="middle" class="node-title" font-size="14">Vector database (ChromaDB)</text>
    <rect x="22" y="38" width="56" height="24" rx="12" fill="#f1f5f9" />
    <text x="50" y="54" text-anchor="middle" class="node-desc" font-weight="600" fill="#334155">Node 1</text>
    <rect x="158" y="38" width="56" height="24" rx="12" fill="#f1f5f9" />
    <text x="186" y="54" text-anchor="middle" class="node-desc" font-weight="600" fill="#334155">Node 2</text>
    <rect x="90" y="65" width="56" height="24" rx="12" fill="#f1f5f9" />
    <text x="118" y="81" text-anchor="middle" class="node-desc" font-weight="600" fill="#334155">Node 3</text>
  </g>

  <!-- ================= MIDDLE: USER QUERY & SEARCH ================= -->

  <!-- Node: User -->
  <g transform="translate(55, 270)">
    <rect width="68" height="68" rx="10" fill="#0284c7" filter="url(#card-shadow)" />
    <!-- User Avatar Icon -->
    <circle cx="34" cy="28" r="10" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M 18 52 C 18 42 25 39 34 39 C 43 39 50 42 50 52" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="34" y="85" text-anchor="middle" class="node-title" fill="#0284c7" font-weight="700">User</text>
  </g>

  <!-- Arrow: User -> Query -->
  <path d="M 135 304 L 195 304" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />

  <!-- Node: Query -->
  <g transform="translate(205, 270)">
    <rect width="68" height="68" rx="10" fill="#0284c7" filter="url(#card-shadow)" />
    <!-- Question Bubble Icon -->
    <path d="M 18 20 C 18 16 22 14 26 14 L 46 14 C 50 14 54 16 54 20 L 54 36 C 54 40 50 42 46 42 L 32 42 L 22 50 L 22 42 L 20 42 C 18 42 18 40 18 36 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="36" y="32" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#ffffff">?</text>
    <text x="34" y="85" text-anchor="middle" class="node-title" fill="#0284c7" font-weight="700">Query</text>
  </g>

  <!-- Arrow: Query -> Multi-Query Expansion -->
  <path d="M 285 304 L 340 304" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="312" y="295" text-anchor="middle" class="arrow-label">Expand</text>

  <!-- Node: Multi-Query Transformation Box -->
  <g transform="translate(350, 260)">
    <rect width="135" height="88" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="68" y="22" text-anchor="middle" class="node-title" font-size="12" fill="#0369a1">Multi-Query (MedGemma)</text>
    <rect x="10" y="32" width="115" height="11" rx="3" fill="#e0f2fe" />
    <text x="14" y="41" font-size="9" font-family="sans-serif" fill="#0369a1">Q1: direct mechanism</text>
    <rect x="10" y="46" width="115" height="11" rx="3" fill="#e0f2fe" />
    <text x="14" y="55" font-size="9" font-family="sans-serif" fill="#0369a1">Q2: regulation pathway</text>
    <rect x="10" y="60" width="115" height="11" rx="3" fill="#e0f2fe" />
    <text x="14" y="69" font-size="9" font-family="sans-serif" fill="#0369a1">Q3: clinical phenotype</text>
    <rect x="10" y="74" width="115" height="11" rx="3" fill="#e0f2fe" />
    <text x="14" y="83" font-size="9" font-family="sans-serif" fill="#0369a1">Q4: genetic targets</text>
  </g>

  <!-- Arrow: Multi-Query -> Vectorize -->
  <path d="M 495 304 L 545 304" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="520" y="295" text-anchor="middle" class="arrow-label">Vectorize</text>

  <!-- Node: Blue Vector {...} -->
  <g transform="translate(555, 270)">
    <rect width="68" height="68" rx="10" fill="#0284c7" filter="url(#card-shadow)" />
    <text x="34" y="44" text-anchor="middle" class="code-font" fill="#ffffff">{...}</text>
    <text x="34" y="85" text-anchor="middle" class="node-title" fill="#0284c7">4x Vectors</text>
  </g>

  <!-- Arrow: Blue Vector -> Vector DB (Search) -->
  <path d="M 635 304 L 815 304 L 815 205" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="700" y="295" class="arrow-label" font-weight="600" fill="#0284c7">Parallel Search</text>

  <!-- ================= BOTTOM: RETRIEVE, FUSION & GENERATE ================= -->

  <!-- Arrow: Vector DB -> Augment (Downward right side) -->
  <path d="M 945 150 L 965 150 L 965 425 L 895 425" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="965" y="290" text-anchor="middle" transform="rotate(90 965 290)" class="arrow-label">Retrieve Candidates</text>

  <!-- Augment Container Box -->
  <g transform="translate(680, 360)">
    <rect width="205" height="130" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="102" y="120" text-anchor="middle" class="section-label" fill="#0284c7" font-size="16">Augment &amp; Fuse</text>
    
    <!-- Inner pill: Query -->
    <rect x="15" y="16" width="75" height="32" rx="8" fill="#e0f2fe" />
    <text x="52" y="36" text-anchor="middle" class="node-desc" font-weight="700" fill="#0369a1">4 Queries</text>

    <!-- Inner pill: Prompts -->
    <rect x="105" y="16" width="85" height="32" rx="8" fill="#e0f2fe" />
    <text x="147" y="36" text-anchor="middle" class="node-desc" font-weight="700" fill="#0369a1">Prompt Bound</text>

    <!-- Inner pill: RRF Deduplication -->
    <rect x="15" y="58" width="175" height="42" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="102" y="75" text-anchor="middle" class="node-desc" font-weight="700" fill="#0284c7">RRF (k=60) Fusion</text>
    <text x="102" y="90" text-anchor="middle" class="node-desc" fill="#64748b">Deduplicate &amp; Rank Top-5</text>
  </g>

  <!-- Arrow: Augment -> LLM -->
  <path d="M 670 425 L 615 425" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="642" y="415" text-anchor="middle" class="arrow-label">Context</text>

  <!-- Node: LLM -->
  <g transform="translate(535, 385)">
    <!-- LLM Chip Icon -->
    <rect x="8" y="8" width="52" height="52" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="34" cy="34" r="14" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
    <path d="M 28 26 L 40 26 M 28 34 L 40 34 M 28 42 L 40 42" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Pins -->
    <line x1="2" y1="24" x2="8" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <line x1="2" y1="34" x2="8" y2="34" stroke="#64748b" stroke-width="1.5"/>
    <line x1="2" y1="44" x2="8" y2="44" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="24" x2="66" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="34" x2="66" y2="34" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="44" x2="66" y2="44" stroke="#64748b" stroke-width="1.5"/>
    <text x="34" y="82" text-anchor="middle" class="node-title">LLM</text>
    <text x="34" y="95" text-anchor="middle" class="node-desc">MedGemma 1.5</text>
  </g>

  <!-- Arrow: LLM -> Response -->
  <path d="M 525 425 L 350 425" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="437" y="415" text-anchor="middle" class="arrow-label">Generate</text>

  <!-- Node: Response -->
  <g transform="translate(265, 390)">
    <rect width="72" height="72" rx="10" fill="#f1f5f9" filter="url(#card-shadow)" />
    <!-- Response Document Icon -->
    <rect x="22" y="16" width="28" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="28" y1="26" x2="44" y2="26" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="28" y1="33" x2="44" y2="33" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="28" y1="40" x2="38" y2="40" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Stamp/Checkmark -->
    <circle cx="42" cy="42" r="7" fill="#0284c7" />
    <path d="M 39 42 L 41 44 L 45 39" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <text x="36" y="88" text-anchor="middle" class="node-title">Response</text>
    <text x="36" y="100" text-anchor="middle" class="node-desc">Grounded &amp; Cited</text>
  </g>

  <!-- Arrow: Response -> User -->
  <path d="M 255 425 L 90 425 L 90 355" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="172" y="415" text-anchor="middle" class="arrow-label" font-weight="600" fill="#0284c7">Delivered</text>
</svg>
