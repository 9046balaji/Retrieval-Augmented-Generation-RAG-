<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748b; }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-style: italic; font-size: 11.5px; fill: #475569; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
    
    <filter id="card-shadow" x="-5%" y="-8%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" fill="#ffffff" rx="16"/>

  <!-- Title Header -->
  <text x="500" y="42" text-anchor="middle" class="title">User Flow &amp; Interaction</text>
  <line x1="465" y1="54" x2="535" y2="54" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= ROW 1: USER INPUT -> BACKEND PROCESSING ================= -->
  
  <!-- Step 1: User & Interface -->
  <g transform="translate(40, 85)">
    <rect width="180" height="120" rx="10" fill="#0284c7" filter="url(#card-shadow)" />
    <!-- User icon -->
    <circle cx="28" cy="26" r="10" fill="#ffffff" />
    <text x="80" y="30" class="node-title" fill="#ffffff" font-weight="700">1. User Interaction</text>
    
    <rect x="12" y="48" width="156" height="60" rx="6" fill="#0369a1" />
    <text x="20" y="66" font-size="10" fill="#ffffff" font-weight="600">• Asks scientific question</text>
    <text x="20" y="82" font-size="10" fill="#e0f2fe">• Tunes Top-K &amp; RRF sliders</text>
    <text x="20" y="98" font-size="10" fill="#e0f2fe">• Streamlit Chatbot UI</text>
  </g>

  <!-- Arrow: Step 1 -> Step 2 -->
  <path d="M 230 145 L 275 145" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="252" y="137" text-anchor="middle" class="arrow-label">Submit</text>

  <!-- Step 2: Multi-Query Expansion -->
  <g transform="translate(285, 85)">
    <rect width="190" height="120" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="95" y="26" text-anchor="middle" class="node-title" fill="#0369a1">2. Query Decomposition</text>
    
    <rect x="12" y="40" width="166" height="68" rx="6" fill="#e0f2fe" />
    <text x="20" y="58" font-size="10" fill="#0369a1" font-weight="700">MedGemma Model</text>
    <text x="20" y="74" font-size="9.5" fill="#334155">• Generates 4 query angles</text>
    <text x="20" y="88" font-size="9.5" fill="#334155">• Covers medical synonyms</text>
    <text x="20" y="102" font-size="9.5" fill="#334155">• BGE-base vectorization</text>
  </g>

  <!-- Arrow: Step 2 -> Step 3 -->
  <path d="M 485 145 L 530 145" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="508" y="137" text-anchor="middle" class="arrow-label">Search</text>

  <!-- Step 3: ChromaDB Retrieval -->
  <g transform="translate(540, 85)">
    <rect width="180" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90" y="26" text-anchor="middle" class="node-title">3. Parallel Retrieval</text>
    
    <rect x="12" y="40" width="156" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="90" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ChromaDB Store</text>
    <text x="90" y="74" text-anchor="middle" font-size="10" fill="#475569">4 queries searched in parallel</text>
    <text x="90" y="90" text-anchor="middle" font-size="10" fill="#475569">Top-5 docs per query</text>
    <text x="90" y="104" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0284c7">20 Candidate Passages</text>
  </g>

  <!-- Arrow: Step 3 -> Step 4 -->
  <path d="M 730 145 L 775 145" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="752" y="137" text-anchor="middle" class="arrow-label">Fuse</text>

  <!-- Step 4: RRF Fusion & Deduplication -->
  <g transform="translate(785, 85)">
    <rect width="180" height="120" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90" y="26" text-anchor="middle" class="node-title" fill="#15803d">4. Fusion &amp; Clean</text>
    
    <rect x="12" y="40" width="156" height="68" rx="6" fill="#dcfce7"/>
    <text x="90" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">RRF Formula (k=60)</text>
    <text x="90" y="74" text-anchor="middle" font-size="9.5" fill="#334155">• Merges rank scores</text>
    <text x="90" y="88" text-anchor="middle" font-size="9.5" fill="#334155">• Removes duplicates (~30%)</text>
    <text x="90" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Top-5 Unique Passages</text>
  </g>

  <!-- ================= CONNECTOR FROM ROW 1 TO ROW 2 ================= -->
  <path d="M 875 215 L 875 250 L 130 250 L 130 285" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="500" y="244" text-anchor="middle" class="arrow-label">Ranked Context Passages + Evidence-Bound Prompt</text>

  <!-- ================= ROW 2: GENERATION, JUDGMENT -> USER DISPLAY ================= -->

  <!-- Step 5: Grounded Answer Synthesis -->
  <g transform="translate(40, 295)">
    <rect width="210" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="105" y="26" text-anchor="middle" class="node-title">5. Grounded Synthesis</text>
    
    <rect x="12" y="40" width="186" height="78" rx="6" fill="#f1f5f9"/>
    <text x="105" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">MedGemma 1.5 4B</text>
    <text x="105" y="74" text-anchor="middle" font-size="9.5" fill="#475569">• 16k context window</text>
    <text x="105" y="88" text-anchor="middle" font-size="9.5" fill="#475569">• Zero hallucination bound</text>
    <text x="105" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0284c7">• Inline [Document ID] tags</text>
  </g>

  <!-- Arrow: Step 5 -> Step 6 -->
  <path d="M 260 360 L 320 360" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="290" y="352" text-anchor="middle" class="arrow-label">Verify</text>

  <!-- Step 6: LLM-as-a-Judge Evaluation -->
  <g transform="translate(330, 295)">
    <rect width="210" height="130" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="105" y="26" text-anchor="middle" class="node-title" fill="#7e22ce">6. Self-Verification</text>
    
    <rect x="12" y="40" width="186" height="78" rx="6" fill="#f3e8ff"/>
    <text x="105" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b21a8">LLM-as-a-Judge</text>
    <text x="105" y="74" text-anchor="middle" font-size="9.5" fill="#475569">• Faithfulness: 5.0 / 5.0</text>
    <text x="105" y="88" text-anchor="middle" font-size="9.5" fill="#475569">• Utilization: High</text>
    <text x="105" y="102" text-anchor="middle" font-size="9.5" fill="#475569">• Answer Relevance: High</text>
  </g>

  <!-- Arrow: Step 6 -> Step 7 -->
  <path d="M 550 360 L 610 360" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="580" y="352" text-anchor="middle" class="arrow-label">Stream to UI</text>

  <!-- Step 7: Chatbot Response & User Display -->
  <g transform="translate(620, 295)">
    <rect width="345" height="130" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="172" y="26" text-anchor="middle" class="node-title" fill="#0284c7">7. Final Response Delivered to User</text>
    
    <rect x="15" y="40" width="315" height="78" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="25" y="58" font-size="10" font-weight="700" fill="#0f172a">💬 Assistant Message Streamed:</text>
    <text x="25" y="74" font-size="9.5" fill="#334155">• Accurate clinical answer with clickable citations</text>
    <text x="25" y="88" font-size="9.5" fill="#334155">• Expandable "🔍 Retrieved Sources &amp; Audit Trail" accordion</text>
    <text x="25" y="104" font-size="9.5" font-weight="600" fill="#15803d">✓ Verified 100% grounded in retrieved research literature</text>
  </g>

  <!-- Bottom Interactive Note -->
  <rect x="40" y="455" width="925" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="480" class="node-title" fill="#0f172a">💡 User Experience Advantage:</text>
  <text x="60" y="500" font-size="12" fill="#475569">The user receives a clean, cited response just like a conversation, while having full transparency into the 4 expanded queries,</text>
  <text x="60" y="515" font-size="12" fill="#475569">retrieved documents, and verification judge scores via the expander bar in the Streamlit UI.</text>
</svg>
