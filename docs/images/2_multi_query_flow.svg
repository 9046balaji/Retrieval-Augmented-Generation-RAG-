<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #0f172a; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748b; }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-style: italic; font-size: 11.5px; fill: #475569; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; }
    </style>
    
    <filter id="card-shadow" x="-5%" y="-8%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" fill="#ffffff" rx="16"/>

  <!-- Title Header -->
  <text x="500" y="42" text-anchor="middle" class="title">Multi-Query RAG Data Flow</text>
  <line x1="465" y1="54" x2="535" y2="54" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= ROW 1: USER QUERY & MULTI-QUERY TRANSFORMATION ================= -->
  
  <!-- Node 1: User Question -->
  <g transform="translate(40, 95)">
    <rect width="170" height="90" rx="10" fill="#0284c7" filter="url(#card-shadow)" />
    <!-- Speech bubble icon -->
    <circle cx="28" cy="28" r="10" fill="#ffffff" />
    <path d="M 28 22 L 28 29 M 28 32 L 28 33" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <text x="85" y="32" class="node-title" fill="#ffffff" font-weight="700">User Question</text>
    <rect x="12" y="48" width="146" height="32" rx="6" fill="#0369a1" />
    <text x="20" y="68" font-size="10" font-family="sans-serif" fill="#ffffff">"How does microRNA affect...</text>
  </g>

  <!-- Arrow: User -> Query Generator -->
  <path d="M 220 140 L 265 140" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="242" y="132" text-anchor="middle" class="arrow-label">Expand</text>

  <!-- Node 2: Multi-Query Transformation Box (MedGemma) -->
  <g transform="translate(275, 75)">
    <rect width="250" height="130" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="125" y="24" text-anchor="middle" class="node-title" fill="#0369a1">Query Expansion (MedGemma)</text>
    
    <rect x="12" y="34" width="226" height="18" rx="4" fill="#e0f2fe" />
    <text x="18" y="47" font-size="10" font-family="sans-serif" fill="#0369a1"><b>Q1:</b> direct metastasis mechanism</text>

    <rect x="12" y="56" width="226" height="18" rx="4" fill="#e0f2fe" />
    <text x="18" y="69" font-size="10" font-family="sans-serif" fill="#0369a1"><b>Q2:</b> regulation pathway &amp; oncogenesis</text>

    <rect x="12" y="78" width="226" height="18" rx="4" fill="#e0f2fe" />
    <text x="18" y="91" font-size="10" font-family="sans-serif" fill="#0369a1"><b>Q3:</b> epithelial-mesenchymal transition</text>

    <rect x="12" y="100" width="226" height="18" rx="4" fill="#e0f2fe" />
    <text x="18" y="113" font-size="10" font-family="sans-serif" fill="#0369a1"><b>Q4:</b> miR-21 miR-155 target genes</text>
  </g>

  <!-- Arrow: Expansion -> Embedding Model -->
  <path d="M 535 140 L 590 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="562" y="132" text-anchor="middle" class="arrow-label">Vectorize</text>

  <!-- Node 3: BGE Embedding Model -->
  <g transform="translate(600, 95)">
    <rect width="135" height="90" rx="10" fill="#f1f5f9" filter="url(#card-shadow)" />
    <!-- Neural icon -->
    <circle cx="28" cy="28" r="4" fill="#3b82f6"/>
    <circle cx="48" cy="18" r="4" fill="#3b82f6"/>
    <circle cx="48" cy="38" r="4" fill="#3b82f6"/>
    <line x1="28" y1="28" x2="48" y2="18" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="28" y1="28" x2="48" y2="38" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="68" y="58" text-anchor="middle" class="node-title">BGE Embedding</text>
    <text x="68" y="72" text-anchor="middle" class="node-desc">768-dim Vectors</text>
  </g>

  <!-- Arrow: BGE -> ChromaDB -->
  <path d="M 745 140 L 795 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="770" y="132" text-anchor="middle" class="arrow-label">Search</text>

  <!-- Node 4: ChromaDB Vector Store -->
  <g transform="translate(805, 85)">
    <rect width="160" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="80" y="25" text-anchor="middle" class="node-title">ChromaDB Store</text>
    <text x="80" y="40" text-anchor="middle" class="node-desc">HNSW Cosine Space</text>
    <rect x="15" y="52" width="130" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="80" y="66" text-anchor="middle" font-size="10" fill="#334155" font-weight="600">5,183 SciFact Papers</text>
    <text x="80" y="92" text-anchor="middle" font-size="9.5" fill="#0284c7" font-weight="700">Retrieve 4 × 5 = 20 Docs</text>
  </g>

  <!-- ================= CONNECTOR FROM ROW 1 TO ROW 2 ================= -->
  <path d="M 885 205 L 885 245 L 125 245 L 125 285" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="500" y="240" text-anchor="middle" class="arrow-label">20 Retrieved Candidate Passages (Pool)</text>

  <!-- ================= ROW 2: FUSION, DEDUPLICATION & SYNTHESIS ================= -->

  <!-- Node 5: RRF & Deduplication Engine -->
  <g transform="translate(40, 295)">
    <rect width="230" height="120" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="115" y="26" text-anchor="middle" class="node-title" fill="#15803d">RRF Fusion &amp; Deduplication</text>
    
    <rect x="15" y="38" width="200" height="24" rx="6" fill="#dcfce7"/>
    <text x="115" y="54" text-anchor="middle" class="code-font" fill="#166534">RRF(d) = Σ 1 / (60 + rank)</text>

    <text x="115" y="80" text-anchor="middle" font-size="10.5" fill="#334155">• Boosts multi-query consensus</text>
    <text x="115" y="96" text-anchor="middle" font-size="10.5" fill="#334155">• Deletes duplicates (30% pruned)</text>
    <text x="115" y="112" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">Top-5 Unique Passages Kept</text>
  </g>

  <!-- Arrow: RRF -> Grounded Generator -->
  <path d="M 280 355 L 340 355" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="310" y="347" text-anchor="middle" class="arrow-label">Context</text>

  <!-- Node 6: Strict Prompt & Generator (MedGemma) -->
  <g transform="translate(350, 295)">
    <rect width="210" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="105" y="24" text-anchor="middle" class="node-title">Grounded Synthesis</text>
    
    <rect x="12" y="34" width="186" height="38" rx="6" fill="#f1f5f9"/>
    <text x="105" y="49" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">Strict Evidence Bounding:</text>
    <text x="105" y="63" text-anchor="middle" font-size="9.5" fill="#0284c7">Zero guessing, 16k context</text>

    <text x="105" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">MedGemma 1.5 4B</text>
    <text x="105" y="106" text-anchor="middle" font-size="10" fill="#64748b">Inline [Document ID] tags</text>
  </g>

  <!-- Arrow: Generator -> Answer -->
  <path d="M 570 355 L 620 355" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="595" y="347" text-anchor="middle" class="arrow-label">Generate</text>

  <!-- Node 7: Verified Response -->
  <g transform="translate(630, 305)">
    <rect width="140" height="100" rx="10" fill="#0284c7" filter="url(#card-shadow)"/>
    <text x="70" y="28" text-anchor="middle" class="node-title" fill="#ffffff" font-weight="700">Cited Answer</text>
    <rect x="12" y="40" width="116" height="48" rx="6" fill="#0369a1"/>
    <text x="18" y="56" font-size="9" fill="#ffffff">"...microRNA triggers EMT</text>
    <text x="18" y="70" font-size="9" fill="#bae6fd" font-weight="700">[Document 25523969]</text>
    <text x="18" y="82" font-size="9" fill="#ffffff">repressing E-cadherin..."</text>
  </g>

  <!-- Arrow: Answer -> LLM-as-a-Judge -->
  <path d="M 780 355 L 820 355" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="800" y="347" text-anchor="middle" class="arrow-label">Judge</text>

  <!-- Node 8: LLM Judge -->
  <g transform="translate(830, 295)">
    <rect width="135" height="120" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="67" y="24" text-anchor="middle" class="node-title" fill="#7e22ce">LLM-as-a-Judge</text>
    
    <rect x="10" y="34" width="115" height="22" rx="4" fill="#f3e8ff"/>
    <text x="67" y="49" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">Faithfulness: 5.0/5.0</text>

    <rect x="10" y="60" width="115" height="22" rx="4" fill="#f3e8ff"/>
    <text x="67" y="75" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">Utilization: High</text>

    <rect x="10" y="86" width="115" height="22" rx="4" fill="#f3e8ff"/>
    <text x="67" y="101" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">Relevance: 5.0/5.0</text>
  </g>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="450" width="920" height="75" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="475" class="node-title" fill="#0f172a">🎯 Key Result of Multi-Query Flow:</text>
  <text x="60" y="498" font-size="12" fill="#475569">Single-query search misses documents due to medical wording variations. Multi-Query explores 4 distinct semantic directions,</text>
  <text x="60" y="515" font-size="12" fill="#475569">achieving <b>35% higher document recall</b> and providing verified citations for zero hallucination.</text>
</svg>
